name: iOS unsigned build

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spinecare-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS app bundle (local signing)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JSX, demo assets and variant identity
        run: |
          node scripts/check_demo_assets.js
          node scripts/verify_app_identity.js
      - name: Verify MediaPipe CocoaPods Swift bridge import
        run: node scripts/patch-mediapipe-ios.js
      - name: Download MediaPipe model
        run: |
          mkdir -p assets/models
          curl --fail --location --retry 3 --output assets/models/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          test -s assets/models/pose_landmarker_lite.task
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install
      - name: Verify generated Xcode bundle identifier
        run: node scripts/verify_app_identity.js --ios-native
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update
      - name: Archive unsigned app for local signing
        run: |
          set -o pipefail
          xcodebuild -workspace ios/SpineCare.xcworkspace -scheme SpineCare -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/SpineCare-unsigned.xcarchive" CODE_SIGNING_ALLOWED=NO archive | tee xcodebuild-archive.log
      - name: Verify archived iOS bundle identifier
        run: |
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - build/SpineCare-unsigned.xcarchive/Products/Applications/SpineCare.app/Info.plist)"
          test "$BUNDLE_ID" = "com.spinecare.mobile.gpt6"
          echo "IDENTITY_PASS release iOS archive: $BUNDLE_ID"
      - name: Package unsigned IPA and archive for local signing
        run: |
          mkdir -p build/ipa/Payload
          ditto build/SpineCare-unsigned.xcarchive/Products/Applications/SpineCare.app build/ipa/Payload/SpineCare.app
          (cd build/ipa && zip -qry ../SpineCare-GPT6-v0.2.0-unsigned.ipa Payload)
          ditto -c -k --sequesterRsrc --keepParent build/SpineCare-unsigned.xcarchive build/SpineCare-GPT6-v0.2.0-unsigned.xcarchive.zip
      - name: Upload Xcode archive diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spinecare-ios-xcode-failure-log
          path: xcodebuild-archive.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload static demo preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinecare-ios-static-preflight
          path: evidence/preflight/checks.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: spinecare-gpt6-ios-unsigned
          path: |
            build/SpineCare-GPT6-v0.2.0-unsigned.ipa
            build/SpineCare-GPT6-v0.2.0-unsigned.xcarchive.zip
            xcodebuild-archive.log
          if-no-files-found: error
          retention-days: 30
