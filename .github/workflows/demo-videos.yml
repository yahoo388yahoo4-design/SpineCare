name: Prepare licensed pose demo videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_demo_videos.py'
      - '.github/workflows/demo-videos.yml'

permissions:
  contents: write

concurrency:
  group: spinecare-demo-assets
  cancel-in-progress: false

jobs:
  build-demo-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install H.264 video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install processing dependencies
        run: |
          python -m pip install --disable-pip-version-check mediapipe==0.10.21 opencv-python-headless==4.11.0.86 "numpy<2"
          ffmpeg -version | head -1
      - name: Download pose model
        run: |
          mkdir -p assets/models
          curl --fail --location --retry 3 --output assets/models/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          test -s assets/models/pose_landmarker_lite.task
      - name: Process clips with MediaPipe, overlay landmarks, capture evidence
        run: python scripts/generate_demo_videos.py
      - name: Verify codecs, hashes and detected frame counts
        run: python scripts/generate_demo_videos.py --verify
      - name: Publish build verification and screenshots as downloadable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinecare-demo-video-processing-evidence
          path: |
            evidence/demo/
            assets/demo/manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit licensed MP4 videos and source metadata into mobile app
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo/*.mp4 assets/demo/manifest.json
          if git diff --cached --quiet; then
            echo "Processed files unchanged"
          else
            git commit -m "Bundle CC BY 3.0 exercise clips with real MediaPipe landmark overlay"
            git push origin HEAD:main
          fi
